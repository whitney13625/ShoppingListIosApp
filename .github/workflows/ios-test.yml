name: iOS Unit Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4


      # 2. Environment Information display (For Debug)
      - name: Show Xcode Version
        run: xcodebuild -version

      # 3. List all available simulators
      - name: List Available Simulators
        run: xcrun simctl list devices available

      # 4. Run Test
      - name: Run Tests
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 16 (" | grep -v "Plus\|Pro\|Max" | head -1 | grep -oE '[A-F0-9-]{36}')
          echo "Using simulator UDID: $UDID"
          set -o pipefail && xcodebuild clean build test \
            -scheme "ShoppingItemApp" \
            -destination "id=$UDID" \
            -resultBundlePath TestResults \
            -enableCodeCoverage YES
