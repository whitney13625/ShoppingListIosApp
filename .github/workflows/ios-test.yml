name: iOS Unit Tests

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-15
   
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      # 1. Assign Xcode version (Same as local environment)
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      # 2. Environment Information display (For Debug)
      - name: Show Xcode Version
        run: xcodebuild -version

      # 3. List all available simulators
      - name: List Available Simulators
        run: xcrun simctl list devices available

      # 4. Run Test
      - name: Run Tests
        run: |
          IOS_VERSION=$(xcrun simctl list runtimes | grep "iOS" | tail -1 | grep -oE '[0-9]+\.[0-9]+' | head -1)
          echo "Using iOS $IOS_VERSION"
          set -o pipefail && xcodebuild clean build test \
            -scheme "ShoppingItemApp" \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=$IOS_VERSION" \
            -resultBundlePath TestResults \
            -enableCodeCoverage YES
